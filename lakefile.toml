name = "lean_to_lambdabox"
version = "0.1.0"
defaultTargets = ["LeanToLambdaBox"]

# Grounds the verified-erasure development on lean4lean's formal Lean type theory
# (VExpr, HasType/IsDefEq, TrExprS/VLCtx, TrEnv, inferType'.WF).
#
# Pinned to the `iota` branch of the barabbs/lean4lean fork, which extends
# upstream (digama0/lean4lean) with ι-reduction support. On the v4.33.0-rc2
# toolchain (matches lean-toolchain); pulls batteries v4.33.0-rc2 transitively.
#
# The pinned revision carries the reviewed ι interface: `TrEnv.pats_iota'` names
# the registered rule payload (`SimplePattern.iotaRHS …, .true`) and ties it to the
# kernel rule's reduct, which is what `PatsIotaSpec` (`IotaPattern.lean`) consumes
# and `PatsIotaSpec.of_trEnv` discharges.
[[require]]
name = "lean4lean"
git = "https://github.com/barabbs/lean4lean"
rev = "1a1ebe8b72c22e0bf6b4a670a6787bdb70c0a3f9"

[[lean_lib]]
name = "LeanToLambdaBox"

# csimp-off duplicates of the five `frontend_bench` programs that the coverage
# measurement (§H) tracks. The originals live in the sibling `benchmarks` repo and are
# byte-frozen; these copies differ only in their `#erase` line (`csimp := false`, which
# every correctness theorem requires — finding D1 — plus an output path under
# `VerifyBench/ast/`). Deliberately NOT in `defaultTargets`: `lake build` is unchanged,
# and elaborating these roots writes `.ast` files, which CI should not do. Build with
# `lake build VerifyBench` from the repo root.
[[lean_lib]]
name = "VerifyBench"
roots = [
  "VerifyBench.Arith",
  "VerifyBench.Sieve",
  "VerifyBench.Quicksort",
  "VerifyBench.BinaryTrees",
  "VerifyBench.Fannkuch",
]

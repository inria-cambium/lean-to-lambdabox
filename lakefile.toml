name = "lean_to_lambdabox"
version = "0.1.0"
defaultTargets = ["LeanToLambdaBox"]

# Grounds the verified-erasure development on lean4lean's formal Lean type theory
# (VExpr, HasType/IsDefEq, TrExprS/VLCtx, TrEnv, inferType'.WF).
#
# Pinned to the `trproj` branch of the barabbs/lean4lean fork, which extends
# upstream (digama0/lean4lean) with ι-reduction support and, now, a real
# definition of `TrProj`. On the v4.33.0-rc2 toolchain (matches lean-toolchain);
# pulls batteries v4.33.0-rc2 transitively.
#
# The pinned revision carries the reviewed ι interface: `TrEnv.pats_iota'` names
# the registered rule payload (`SimplePattern.iotaRHS …, .true`) and ties it to the
# kernel rule's reduct, which is what `PatsIotaSpec` (`IotaPattern.lean`) consumes
# and `PatsIotaSpec.of_trEnv` discharges.
#
# It also carries the TrProj round (A0-A3 of the commission):
#   A0  `TrProj` takes `(env : VEnv) (U : Nat)`; `TrExprS.proj` reads
#       `TrProj env Us.length Δ.toCtx s i e' e''`. Downstream cost: `TrProj.weak'`
#       gained an `Ordered env` premise, so the two re-proofs of `TrExprS.weakFV'`
#       in `ErasesStrengthen.lean` pass `henv`.
#   A1  `TrProj` is no longer `sorry`-valued — it is defined as a structure-recursor
#       spine (`env.pats` membership on the ι pattern + a `HasType` conjunct). This
#       retires the *definitional* `sorryAx` that `TrExprS`, and hence `Erases`, had
#       carried from the start.
#   A2  `TrEnv.proj_defeq` exists as a real statement, proof deferred (`PROJ-TODO`).
#       Not consumed downstream yet.
#   A3  Five of the seven `TrProj.*` structural lemmas came back proved (`weak'`,
#       `weakN`, `defeqDFC`, `wf`, `instN`, `instL`, plus a new `mono`);
#       `weak'_inv` and `uniq` remain `PROJ-TODO`.
#   C1  (`IsDefEqU.weakN_iff` forward direction) was NOT discharged; the sanctioned
#       fallback — a written analysis — was delivered instead. `ErasableStrengthen`
#       stays a named premise downstream (see `ErasesStrengthen.lean`).
#
# **Round 2** (`b6a5a38`, 2026-08-28) answers the three asks of `upstream-round2.md`.
# It discharges no `sorry`, adds no `axiom` (71, identical list) and leaves the 15
# `IOTA-TODO`/4 `PROJ-TODO` markers where they were. What it does deliver:
#   1  `TrEnv.proj_defeq` is **re-stated** over a new upstream `TrProjCtor`, so its two
#      constructor names finally coincide. This is the STATEMENT correction this repo
#      escalated (the old statement was plausibly unprovable, not merely unproved), and
#      it landed character-identical to the shape `ProjDefeqSpec.proj_defeq` states —
#      so `ProjDefeqSpec.of_trEnv` is now a real one-liner and needs no `.toTrProj`.
#      The PROOF is still `sorry` (`Verify/Environment/Lemmas.lean:652`), with the
#      residual re-analysed and explicitly NOT `pat_uniq`: it is the structure-recursor
#      shape (`(1,1,0)` is not recoverable from the ι pattern's sum), the ctor-arity
#      threading, and a `safety` side condition. So `of_trEnv` carries `sorryAx` and the
#      capstones keep `ProjDefeqSpec` as a named premise.
#      ⚠️ Downstream cost: `TrProjCtor`, `TrProjCtor.toTrProj` and
#      `TrProj.exists_ctorName` now exist UPSTREAM in `Lean4Lean`, where this repo had
#      been carrying character-identical copies. The copies are deleted
#      (`ProjPattern.lean`); the mirror is upstream's now.
#   2  `TrEnv.pats_iota_inv` — the converse of `pats_iota'`, recovering the kernel
#      recursor and its rule from a registered ι pattern. **Fully proved, `sorryAx`-free.**
#      This is ask 2a; the 2b specialization (`pats_iota_ctor`, `cName ∈ ival.ctors`) was
#      NOT landed — `VInductDecl.WF` does not pin the recursor↔inductive boundary — so
#      the downstream takes the sanctioned 2a bridge: `ProjCtorAgree` is now a THEOREM
#      (`ProjDischarge.projCtorAgree_of_trEnv`) from a `TrEnv` plus `ProjRecRules`, a
#      `kenv`-side certificate of exactly the class `ProjShape` already carries.
#   3  C1 (`IsDefEqU.weakN_iff` forward) again NOT discharged, as predicted. `hstr :
#      ErasableStrengthen` stays the ledger's single class-R residue.
#
# The pin also carries the follow-up that makes `TrProj` a (near-)functional relation:
# the motive is no longer existential. It is forced to the canonical constant motive
# `.lam structTy fieldTy.lift`, with `structTy`/`fieldTy` pinned by two `HasType`
# conjuncts (the major's type — new — and the reduct's, which replaces the old
# anonymous `∃ A`). A free motive is under-determined on a neutral major, which made
# `TrProj.uniq` false rather than merely unproved; that part of the obligation is now
# gone, and what remains is ordinary (`Injectivity.lean` + iota `pat_uniq`). The
# constant motive is correct exactly for **non-dependent** structure fields — every
# typeclass projection, but not `Sigma.snd` — and upstream now states that scope in
# the definition's docstring. No `TrProj.*` lemma signature moved; the cost lands on
# code that *constructs* or *destructures* a `TrProj` (nine binders now, not eight),
# i.e. `ProjPattern.lean`.
#
# ⚠️ `trproj` is a merge of upstream `master`, so this pin also absorbs master's
# level-normalization rewrite, the K-target flag fix, `lazyDeltaProjReduction`, and
# one new `axiom any_eq_any_toList` (`Verify/Axioms.lean`) plus native `bv_decide`
# axioms reachable through `TrExprS.instL`. Recorded in the trust ledger
# (`ColdStart.lean`) and in the audit baseline (`scratch/final_audit.lean`).
[[require]]
name = "lean4lean"
git = "https://github.com/barabbs/lean4lean"
rev = "b6a5a385a1334131b7a0a9718c8f332e29dddeb2"

[[lean_lib]]
name = "LeanToLambdaBox"

# csimp-off duplicates of the five `frontend_bench` programs that the coverage
# measurement (§H) tracks. The originals live in the sibling `benchmarks` repo and are
# byte-frozen; these copies differ only in their `#erase` line (`csimp := false`, which
# every correctness theorem requires — finding D1 — plus an output path under
# `VerifyBench/ast/`). Deliberately NOT in `defaultTargets`: `lake build` is unchanged,
# and elaborating these roots writes `.ast` files, which CI should not do. Build with
# `lake build VerifyBench` from the repo root.
[[lean_lib]]
name = "VerifyBench"
roots = [
  "VerifyBench.Arith",
  "VerifyBench.Sieve",
  "VerifyBench.Quicksort",
  "VerifyBench.BinaryTrees",
  "VerifyBench.Fannkuch",
]
